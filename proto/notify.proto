syntax = "proto3";

package notify;

import "google/api/annotations.proto";

option go_package = "./protogen/notify";

enum MeetingStage {
  STAGE_UNSPECIFIED       = 0;
  STAGE_CONNECTION        = 1;
  STAGE_EXPERIENCE_DESIGN = 2;
}

// -----------------------------------------------------------------------
// Core response messages
// -----------------------------------------------------------------------

message MeetingCancellation {
  int32        meeting_id     = 1;
  int32        lead_id        = 2;
  string       lead_name      = 3;
  string       reason         = 4;
  MeetingStage stage          = 5;
  string       event_datetime = 6;
  string       created_at     = 7;
}

message MeetingSuccess {
  int32        lead_id              = 1;
  string       lead_name            = 2;
  string       description          = 3;
  MeetingStage stage                = 4;
  string       success_datetime     = 5;
  string       next_action          = 6;
  bool         quote_link_generated = 7;
  string       created_at           = 8;
}

message MeetingScheduled {
  int32        id           = 1;
  int32        lead_id      = 2;
  string       lead_name    = 3;
  string       title        = 4;
  string       description  = 5;
  string       meeting_date = 6;
  string       slot         = 7;
  string       meeting_type = 8;
  MeetingStage stage        = 9;
  string       created_at   = 10;
}

message MeetingRescheduled {
  int32        id           = 1;
  int32        lead_id      = 2;
  string       lead_name    = 3;
  string       title        = 4;
  string       description  = 5;
  string       meeting_date = 6;
  string       slot         = 7;
  string       meeting_type = 8;
  MeetingStage stage        = 9;
  string       reason       = 10;
  string       created_at   = 11;
}

// -----------------------------------------------------------------------
// Request messages — Cancellation
// -----------------------------------------------------------------------

message CreateCancellationRequest {
  int32        lead_id        = 1;
  string       lead_name      = 2;
  string       reason         = 3;
  MeetingStage stage          = 4;
  string       event_datetime = 5;
}

message GetByMeetingIDRequest {
  int32 meeting_id = 1;
}

message GetByLeadIDRequest {
  int32 lead_id = 1;
}

// -----------------------------------------------------------------------
// Request messages — Success
// -----------------------------------------------------------------------

message CreateSuccessRequest {
  int32        lead_id              = 1;
  string       description          = 2;
  MeetingStage stage                = 3;
  string       success_datetime     = 4;
  string       next_action          = 5;
  bool         quote_link_generated = 6;
}

// -----------------------------------------------------------------------
// Request messages — Scheduled
// -----------------------------------------------------------------------

message CreateScheduledRequest {
  int32        lead_id      = 1;
  string       lead_name    = 2;
  string       title        = 3;
  string       description  = 4;
  string       meeting_date = 5;
  string       slot         = 6;
  string       meeting_type = 7;
  MeetingStage stage        = 8;
}

message GetScheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetScheduledByLeadIDRequest {
  int32 lead_id = 1;
}

// -----------------------------------------------------------------------
// Request messages — Rescheduled
// -----------------------------------------------------------------------

message CreateRescheduledRequest {
  int32        lead_id      = 1;
  string       lead_name    = 2;
  string       title        = 3;
  string       description  = 4;
  string       meeting_date = 5;
  string       slot         = 6;
  string       meeting_type = 7;
  MeetingStage stage        = 8;
  string       reason       = 9;
}

message GetRescheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetRescheduledByLeadIDRequest {
  int32 lead_id = 1;
}

// -----------------------------------------------------------------------
// Response messages
// -----------------------------------------------------------------------

message CancellationResponse {
  MeetingCancellation data = 1;
}

message CancellationListResponse {
  repeated MeetingCancellation data = 1;
}

message SuccessResponse {
  MeetingSuccess data = 1;
}

message SuccessListResponse {
  repeated MeetingSuccess data = 1;
}

message ScheduledResponse {
  MeetingScheduled data = 1;
}

message ScheduledListResponse {
  repeated MeetingScheduled data = 1;
}

message RescheduledResponse {
  MeetingRescheduled data = 1;
}

message RescheduledListResponse {
  repeated MeetingRescheduled data = 1;
}

message DeleteResponse {
  string message = 1;
}

// -----------------------------------------------------------------------
// Lead messages
// -----------------------------------------------------------------------

message Lead {
  int32  lead_id    = 1;
  string lead_name  = 2;
  int64  mobile     = 3;
  string lead_type  = 4;
  string created_at = 5;
}

message CreateLeadRequest {
  string lead_name = 1;
  int64  mobile    = 2;
  string lead_type = 3; // SALES_POOL | EXTERNAL_LEAD | GOOGLE_ADS | META_ADS |
                        // ADD_LEAD | IVR_CALL | WEBSITE_LEAD | WALK_IN_LEAD | WHATSAPP
}

message LeadResponse {
  Lead data = 1;
}

message LeadListResponse {
  repeated Lead data = 1;
}

// -----------------------------------------------------------------------
// Booking messages
// -----------------------------------------------------------------------

message Booking {
  int32  booking_id     = 1;
  int32  lead_id        = 2;
  string lead_name      = 3;
  string payment_type   = 4; // TOKEN | BOOKING
  double paid_amount    = 5;
  double remaining_amount = 6;
  string payment_date   = 7; // RFC3339
  string payment_status = 8; // PENDING | SUCCESS | FAILED
  string remarks        = 9;
  string created_at     = 10;
}

message CreateBookingRequest {
  int32  lead_id        = 1;
  string lead_name      = 2;
  string payment_type   = 3; // TOKEN | BOOKING
  double amount         = 4; // paid amount
  string payment_date   = 5; // RFC3339
  string payment_status = 6; // PENDING | SUCCESS | FAILED
  string remarks        = 7;
}

message GetBookingByIDRequest {
  int32 booking_id = 1;
}

message GetBookingByLeadIDRequest {
  int32 lead_id = 1;
}

message BookingResponse {
  Booking data = 1;
}

message BookingListResponse {
  repeated Booking data = 1;
}

// -----------------------------------------------------------------------
// Count messages
// -----------------------------------------------------------------------

message CountsRequest {}   // empty — returns global totals

message CountsResponse {
  int32 total_leads      = 1;
  int32 total_scheduled  = 2;
  int32 total_rescheduled = 3;
  int32 total_cancelled  = 4;
  int32 total_success    = 5;
  int32 total_bookings   = 6;
}

// -----------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------

service NotifyService {

  // Cancellation
  rpc CreateCancellation(CreateCancellationRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/cancellation"
      body: "*"
    };
  }

  rpc GetAllCancellations(GetByLeadIDRequest) returns (CancellationListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation"
    };
  }

  rpc GetCancellationByID(GetByMeetingIDRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation/{meeting_id}"
    };
  }

  // Success
  rpc CreateSuccess(CreateSuccessRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/success"
      body: "*"
    };
  }

  rpc GetAllSuccesses(GetByLeadIDRequest) returns (SuccessListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success"
    };
  }

  rpc GetSuccessByLeadID(GetByLeadIDRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success/{lead_id}"
    };
  }

  // Scheduled
  rpc CreateScheduled(CreateScheduledRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/scheduled"
      body: "*"
    };
  }

  rpc GetAllScheduled(GetScheduledByLeadIDRequest) returns (ScheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled"
    };
  }

  rpc GetScheduledByID(GetScheduledByIDRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled/{meeting_id}"
    };
  }

  // Rescheduled
  rpc CreateRescheduled(CreateRescheduledRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/rescheduled"
      body: "*"
    };
  }

  rpc GetAllRescheduled(GetRescheduledByLeadIDRequest) returns (RescheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled"
    };
  }

  rpc GetRescheduledByID(GetRescheduledByIDRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled/{meeting_id}"
    };
  }

  // Leads
  rpc CreateLead(CreateLeadRequest) returns (LeadResponse) {
    option (google.api.http) = {
      post: "/v1/leads"
      body: "*"
    };
  }

  rpc GetAllLeads(CountsRequest) returns (LeadListResponse) {
    option (google.api.http) = {
      get: "/v1/leads"
    };
  }

  rpc GetLeadByID(GetByLeadIDRequest) returns (LeadResponse) {
    option (google.api.http) = {
      get: "/v1/leads/{lead_id}"
    };
  }

  // Booking
  rpc CreateBooking(CreateBookingRequest) returns (BookingResponse) {
    option (google.api.http) = {
      post: "/v1/bookings"
      body: "*"
    };
  }

  rpc GetAllBookings(GetBookingByLeadIDRequest) returns (BookingListResponse) {
    option (google.api.http) = {
      get: "/v1/bookings"
    };
  }

  rpc GetBookingByID(GetBookingByIDRequest) returns (BookingResponse) {
    option (google.api.http) = {
      get: "/v1/bookings/{booking_id}"
    };
  }

  // Counts
  rpc GetCounts(CountsRequest) returns (CountsResponse) {
    option (google.api.http) = {
      get: "/v1/counts"
    };
  }
}
