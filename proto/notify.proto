syntax = "proto3";

package notify;

import "google/api/annotations.proto";

option go_package = "./protogen/notify";

enum MeetingMilestone {
  MILESTONE_UNSPECIFIED       = 0;
  MILESTONE_CONNECTION        = 1;
  MILESTONE_EXPERIENCE_DESIGN = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PRE_10_PERCENT = 1;
  MILESTONE_10_PERCENT = 2;
  MILESTONE_40_PERCENT = 3;
}

// -----------------------------------------------------------------------
// Core response messages
// -----------------------------------------------------------------------

message MeetingCancellation {
  int32            meeting_id      = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  MeetingMilestone milestone       = 5;
  string           created_at      = 6;
}

message MeetingSuccess {
  string lead_identifier      = 1;
  string lead_name            = 2;
  string assigned_to          = 3;
  string next_action          = 4;
  bool   quote_link_generated = 5;
  string created_at           = 6;
}

message MeetingScheduled {
  int32            id              = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  string           title           = 5;
  string           meeting_date    = 6;
  string           slot            = 7;
  string           meeting_type    = 8; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 9;
  string           created_at      = 10;
}

message MeetingRescheduled {
  int32            id              = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  string           title           = 5;
  string           meeting_date    = 6;
  string           slot            = 7;
  string           meeting_type    = 8; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 9;
  string           created_at      = 10;
}

// -----------------------------------------------------------------------
// Request messages — Cancellation (PUT)
// -----------------------------------------------------------------------

message CancellationRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  MeetingMilestone milestone       = 4;
}

message GetByMeetingIDRequest {
  int32 meeting_id = 1;
}

message GetByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Request messages — Success
// -----------------------------------------------------------------------

message CreateSuccessRequest {
  string lead_identifier      = 1;
  string lead_name            = 2;
  string assigned_to          = 3;
  string next_action          = 4;
  bool   quote_link_generated = 5;
}

// -----------------------------------------------------------------------
// Request messages — Scheduled
// -----------------------------------------------------------------------

message CreateScheduledRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  string           meeting_date    = 4;
  string           slot            = 5;
  string           meeting_type    = 6; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 7;
}

message GetScheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetScheduledByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Request messages — Rescheduled (PUT)
// -----------------------------------------------------------------------

message RescheduledRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  string           meeting_date    = 4;
  string           slot            = 5;
  string           meeting_type    = 6; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 7;
}

message GetRescheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetRescheduledByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Response messages
// -----------------------------------------------------------------------

message CancellationResponse {
  MeetingCancellation data = 1;
}

message CancellationListResponse {
  repeated MeetingCancellation data = 1;
}

message SuccessResponse {
  MeetingSuccess data = 1;
}

message SuccessListResponse {
  repeated MeetingSuccess data = 1;
}

message ScheduledResponse {
  MeetingScheduled data = 1;
}

message ScheduledListResponse {
  repeated MeetingScheduled data = 1;
}

message RescheduledResponse {
  MeetingRescheduled data = 1;
}

message RescheduledListResponse {
  repeated MeetingRescheduled data = 1;
}

message DeleteResponse {
  string message = 1;
}

// -----------------------------------------------------------------------
// Lead messages
// -----------------------------------------------------------------------

message Lead {
  string lead_identifier = 1;
  string lead_name       = 2;
  string lead_type       = 3;
  string assigned_to     = 4;
  string created_at      = 5;
}

message CreateLeadRequest {
  string lead_identifier = 1;
  string lead_name       = 2;
  string lead_type       = 3; // SALES_POOL | EXTERNAL_LEAD | GOOGLE_ADS | META_ADS |
                               // ADD_LEAD | IVR_CALL | WEBSITE_LEAD | WALK_IN_LEAD | WHATSAPP
  string assigned_to     = 4;
}

message LeadResponse {
  Lead data = 1;
}

message LeadListResponse {
  repeated Lead data = 1;
}

// -----------------------------------------------------------------------
// Booking messages
// -----------------------------------------------------------------------

message Booking {
  int32  booking_id        = 1;
  string lead_identifier   = 2;
  string lead_name         = 3;
  string assigned_to       = 4;
  string payment_type      = 5; // TOKEN | BOOKING
  double paid_amount       = 6;
  double remaining_amount  = 7;
  string payment_date      = 8; // RFC3339
  string payment_status    = 9; // PENDING | SUCCESS | FAILED
  string remarks           = 10;
  string created_at        = 11;
}

message CreateBookingRequest {
  string lead_identifier = 1;
  string lead_name       = 2;
  string assigned_to     = 3;
  string payment_type    = 4; // TOKEN | BOOKING
  double amount          = 5; // paid amount
  string payment_date    = 6; // RFC3339
  string payment_status  = 7; // PENDING | SUCCESS | FAILED
  string remarks         = 8;
  double remaining_amount = 9;
}

message GetBookingByIDRequest {
  int32 booking_id = 1;
}

message GetBookingByLeadIdentifierRequest {
  string lead_identifier = 1;
}

message BookingResponse {
  Booking data = 1;
}

message BookingListResponse {
  repeated Booking data = 1;
}

// -----------------------------------------------------------------------
// Count messages
// -----------------------------------------------------------------------

message CountsRequest {}   // empty — returns global totals

message CountsResponse {
  int32 total_leads       = 1;
  int32 total_scheduled   = 2;
  int32 total_rescheduled = 3;
  int32 total_cancelled   = 4;
  int32 total_success     = 5;
  int32 total_bookings    = 6;
}








































































++++++++++++++++++++++++++++++++++

// -----------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------

service NotifyService {

  // Cancellation — PUT
  rpc Cancellation(CancellationRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      put: "/v1/meetings/cancellation"
      body: "*"
    };
  }

  rpc GetAllCancellations(GetByLeadIdentifierRequest) returns (CancellationListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation"
    };
  }

  rpc GetCancellationByID(GetByMeetingIDRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation/{meeting_id}"
    };
  }

  // Success
  rpc CreateSuccess(CreateSuccessRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/success"
      body: "*"
    };
  }

  rpc GetAllSuccesses(GetByLeadIdentifierRequest) returns (SuccessListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success"
    };
  }

  rpc GetSuccessByLeadIdentifier(GetByLeadIdentifierRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success/{lead_identifier}"
    };
  }

  // Scheduled
  rpc CreateScheduled(CreateScheduledRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/scheduled"
      body: "*"
    };
  }

  rpc GetAllScheduled(GetScheduledByLeadIdentifierRequest) returns (ScheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled"
    };
  }

  rpc GetScheduledByID(GetScheduledByIDRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled/{meeting_id}"
    };
  }

  // Rescheduled — PUT
  rpc Rescheduled(RescheduledRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      put: "/v1/meetings/rescheduled"
      body: "*"
    };
  }

  rpc GetAllRescheduled(GetRescheduledByLeadIdentifierRequest) returns (RescheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled"
    };
  }

  rpc GetRescheduledByID(GetRescheduledByIDRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled/{meeting_id}"
    };
  }

  // Leads
  rpc CreateLead(CreateLeadRequest) returns (LeadResponse) {
    option (google.api.http) = {
      post: "/v1/leads"
      body: "*"
    };
  }

  rpc GetAllLeads(CountsRequest) returns (LeadListResponse) {
    option (google.api.http) = {
      get: "/v1/leads"
    };
  }

  rpc GetLeadByIdentifier(GetByLeadIdentifierRequest) returns (LeadResponse) {
    option (google.api.http) = {
      get: "/v1/leads/{lead_identifier}"
    };
  }

  // Booking
  rpc CreateBooking(CreateBookingRequest) returns (BookingResponse) {
    option (google.api.http) = {
      post: "/v1/bookings"
      body: "*"
    };
  }

  rpc GetAllBookings(GetBookingByLeadIdentifierRequest) returns (BookingListResponse) {
    option (google.api.http) = {
      get: "/v1/bookings"
    };
  }

  rpc GetBookingByID(GetBookingByIDRequest) returns (BookingResponse) {
    option (google.api.http) = {
      get: "/v1/bookings/{booking_id}"
    };
  }

  // Counts
  rpc GetCounts(CountsRequest) returns (CountsResponse) {
    option (google.api.http) = {
      get: "/v1/counts"
    };
  }
}