syntax = "proto3";

package notify;

import "google/api/annotations.proto";

option go_package = "./protogen/notify";

enum MeetingMilestone {
  MILESTONE_UNSPECIFIED       = 0;
  MILESTONE_CONNECTION        = 1;
  MILESTONE_EXPERIENCE_DESIGN = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PRE_10_PERCENT = 1;
  MILESTONE_10_PERCENT = 2;
  MILESTONE_40_PERCENT = 3;
}

// -----------------------------------------------------------------------
// Core response messages
// -----------------------------------------------------------------------

message MeetingCancellation {
  int32            meeting_id      = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  MeetingMilestone milestone       = 5;
  string           created_at      = 6;
}

message MeetingSuccess {
  string lead_identifier      = 1;
  string lead_name            = 2;
  string assigned_to          = 3;
  string next_action          = 4;
  bool   quote_link_generated = 5;
  string created_at           = 6;
}

message MeetingScheduled {
  int32            id              = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  string           title           = 5;
  string           meeting_date    = 6;
  string           slot            = 7;
  string           meeting_type    = 8; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 9;
  string           created_at      = 10;
}

message MeetingRescheduled {
  int32            id              = 1;
  string           lead_identifier = 2;
  string           lead_name       = 3;
  string           assigned_to     = 4;
  string           title           = 5;
  string           meeting_date    = 6;
  string           slot            = 7;
  string           meeting_type    = 8; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 9;
  string           created_at      = 10;
}

// -----------------------------------------------------------------------
// Request messages — Cancellation (PUT)
// -----------------------------------------------------------------------

message CancellationRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  MeetingMilestone milestone       = 4;
}

message GetByMeetingIDRequest {
  int32 meeting_id = 1;
}

message GetByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Request messages — Success
// -----------------------------------------------------------------------

message CreateSuccessRequest {
  string lead_identifier      = 1;
  string lead_name            = 2;
  string assigned_to          = 3;
  string next_action          = 4;
  bool   quote_link_generated = 5;
}

// -----------------------------------------------------------------------
// Request messages — Scheduled
// -----------------------------------------------------------------------

message CreateScheduledRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  string           meeting_date    = 4;
  string           slot            = 5;
  string           meeting_type    = 6; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 7;
}

message GetScheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetScheduledByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Request messages — Rescheduled (PUT)
// -----------------------------------------------------------------------

message RescheduledRequest {
  string           lead_identifier = 1;
  string           lead_name       = 2;
  string           assigned_to     = 3;
  string           meeting_date    = 4;
  string           slot            = 5;
  string           meeting_type    = 6; // VIRTUAL_MEETING | SHOWROOM_VISIT | SITE_VISIT
  MeetingMilestone milestone       = 7;
}

message GetRescheduledByIDRequest {
  int32 meeting_id = 1;
}

message GetRescheduledByLeadIdentifierRequest {
  string lead_identifier = 1;
}

// -----------------------------------------------------------------------
// Response messages
// -----------------------------------------------------------------------

message CancellationResponse {
  MeetingCancellation data = 1;
}

message CancellationListResponse {
  repeated MeetingCancellation data = 1;
}

message SuccessResponse {
  MeetingSuccess data = 1;
}

message SuccessListResponse {
  repeated MeetingSuccess data = 1;
}

message ScheduledResponse {
  MeetingScheduled data = 1;
}

message ScheduledListResponse {
  repeated MeetingScheduled data = 1;
}

message RescheduledResponse {
  MeetingRescheduled data = 1;
}

message RescheduledListResponse {
  repeated MeetingRescheduled data = 1;
}

message DeleteResponse {
  string message = 1;
}

// -----------------------------------------------------------------------
// Lead messages
// -----------------------------------------------------------------------

message Lead {
  string lead_identifier = 1;
  string lead_name       = 2;
  string lead_type       = 3;
  string assigned_to     = 4;
  string created_at      = 5;
}

message CreateLeadRequest {
  string lead_identifier = 1;
  string lead_name       = 2;
  string lead_type       = 3; // SALES_POOL | EXTERNAL_LEAD | GOOGLE_ADS | META_ADS |
                               // ADD_LEAD | IVR_CALL | WEBSITE_LEAD | WALK_IN_LEAD | WHATSAPP
  string assigned_to     = 4;
}

message LeadResponse {
  Lead data = 1;
}

message LeadListResponse {
  repeated Lead data = 1;
}

// -----------------------------------------------------------------------
// Booking messages
// -----------------------------------------------------------------------

message Booking {
  int32  booking_id        = 1;
  string lead_identifier   = 2;
  string lead_name         = 3;
  string assigned_to       = 4;
  string payment_type      = 5; // TOKEN | BOOKING
  double paid_amount       = 6;
  double remaining_amount  = 7;
  string payment_date      = 8; // RFC3339
  string payment_status    = 9; // PENDING | SUCCESS | FAILED
  string remarks           = 10;
  string created_at        = 11;
}

message CreateBookingRequest {
  string lead_identifier = 1;
  string lead_name       = 2;
  string assigned_to     = 3;
  string payment_type    = 4; // TOKEN | BOOKING
  double amount          = 5; // paid amount
  string payment_date    = 6; // RFC3339
  string payment_status  = 7; // PENDING | SUCCESS | FAILED
  string remarks         = 8;
  double remaining_amount = 9;
}

message GetBookingByIDRequest {
  int32 booking_id = 1;
}

message GetBookingByLeadIdentifierRequest {
  string lead_identifier = 1;
}

message BookingResponse {
  Booking data = 1;
}

message BookingListResponse {
  repeated Booking data = 1;
}

// -----------------------------------------------------------------------
// Count messages
// -----------------------------------------------------------------------

message CountsRequest {}   // empty — returns global totals

message CountsResponse {
  int32 total_leads       = 1;
  int32 total_scheduled   = 2;
  int32 total_rescheduled = 3;
  int32 total_cancelled   = 4;
  int32 total_success     = 5;
  int32 total_bookings    = 6;
}
// -----------------------------------------------------------------------
// Design Notification Messages (APIs 01-18)
// -----------------------------------------------------------------------

message DesignLeadPre10Request {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string current_phase = 1;
    string designer_name = 2;
    string sales_executive_name = 3;

    message Slot {
      string date = 1;
      string slot_time = 2;
    }

    Slot slot = 4;
    string meeting_type = 5;
  }

  Payload payload = 4;
}
message DesignLeadPre10Response {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string current_phase = 1;
    string designer_name = 2;
    string sales_executive_name = 3;

    message Slot {
      string date = 1;
      string slot_time = 2;
    }

    Slot slot = 4;
    string meeting_type = 5;
  }

  Payload payload = 6;
  string created_at = 7;
}

// 02 — 10–20% Phase Entered
message DesignLead1020Request {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string previous_phase = 1;
    string trigger = 2;
    string message = 3;
  }

  Payload payload = 4;
}

message DesignLead1020Response {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string phase = 6;

    message Payload {
      string previous_phase = 1;
      string trigger = 2;
      string message = 3;
    }

    Payload payload = 7;
    string created_at = 8;
  }

  Data data = 1;
}

// 03 — Milestone Completed
message DesignMilestoneRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string milestone_name = 1;
    string task_name = 2;
    int32 milestone_index = 3;
    string designer_name = 4;
  }

  Payload payload = 4;
}

message DesignMilestoneResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string milestone_name = 6;
    string task_name = 7;
    int32 milestone_index = 8;
    string designer_name = 9;
    string created_at = 10;
  }

  Data data = 1;
}
// 04 — Payment Requested
message DesignPaymentRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    PaymentType payment_type = 1;
    string upload_name = 2;
    double amount = 3;
  }

  Payload payload = 4;
}

message DesignPaymentRequestResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    PaymentType payment_type = 6;
    string upload_name = 7;
    double amount = 8;
    string created_at = 9;
  }

  Data data = 1;
}


// 05 — Payment / Sales Closure Status
message DesignPaymentStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string payment_type = 8;
  string milestone_context = 9;
  string approver_name = 10;
  double amount = 11;
  string created_at = 12;
  string rejection_reason = 13;
}

message DesignPaymentStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string payment_type = 3;
    string milestone_context = 4;
    string approver_name = 5;
    double amount = 6;
    string rejection_reason = 7;
  }

  Payload payload = 4;
}

message DesignDQCRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string dqc_round = 4;
  int32 review_id = 5;
  string designer_name = 6;
}

message DesignDQCRequestResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string dqc_round = 6;
    int32 review_id = 7;
    string designer_name = 8;
    string created_at = 9;
  }
  Data data = 1;
}

// 07 — DQC Status
message DesignDQCStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string dqc_round = 8;
  string designer_name = 9;
  string created_at = 10;
  string rejection_reason = 11;
}

message DesignDQCStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string dqc_round = 3;
    string designer_name = 4;
    string rejection_reason = 5;
  }

  Payload payload = 4;
}

// 08 — MMT Visit Requested
message DesignMMTRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5; 
  string mmt_scope = 6;
  string visit_date = 7;
  string visit_time = 8;
  int32 mmt_manager_id = 9;
  string designer_name = 10;
  string mmt_manager_name = 11;
  string created_at = 12;
}

message DesignMMTRequestResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string mmt_scope = 1;
    string visit_date = 2;
    string visit_time = 3;
    int32 mmt_manager_id = 4;
    string designer_name = 5;
    string mmt_manager_name = 6;
  }

  Payload payload = 4;
}

// -----------------------------------------------------------------------
// Design Notification Messages (APIs 09-18)
// -----------------------------------------------------------------------

// 09 — MMT Executive Assigned
message DesignMMTAssignRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string assignment_type = 1;
    string to_name = 2;
    int32 to_id = 3;
  }

  Payload payload = 6;
  string created_at = 7;
}

message DesignMMTAssignResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string assignment_type = 1;
    string to_name = 2;
    int32 to_id = 3;
  }

  Payload payload = 4;
}

// 10 — MMT Documents Ready
message DesignMMTDocReadyRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string mmt_scope = 1;
    string via = 2;
    string upload_name = 3;
    string approved_by = 4;
  }

  Payload payload = 6;
  string created_at = 7;
}

message DesignMMTDocReadyResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string mmt_scope = 1;
    string via = 2;
    string upload_name = 3;
    string approved_by = 4;
  }

  Payload payload = 3;
}

// 11 — Design Meeting Scheduled
message DesignMeetingRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string meeting_type = 6;
  string mod = 7;

  message Slot {
    string date = 1;
    string time_slot = 2;
  }

  Slot slot = 8;
  string created_at = 9;
}

message DesignMeetingResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string meeting_type = 1;
    string mod = 2;

    message Slot {
      string date = 1;
      string time_slot = 2;
    }

    Slot slot = 3;
  }

  Payload payload = 3;
}

// 12 — Designer Reassignment
message DesignAssignDesignerRequest {
  string project_id = 1;
  string lead_name = 2;
  string notification_type = 3;
  string notification_action = 4;

  message Payload {
    string assignment_type = 1;
    int32 from_id = 2;
    int32 to_id = 3;
    string from_name = 4;
    string to_name = 5;
  }

  Payload payload = 5;
  string created_at = 6;
}

message DesignAssignDesignerResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string assignment_type = 1;
    int32 from_id = 2;
    int32 to_id = 3;
    string from_name = 4;
    string to_name = 5;
  }

  Payload payload = 3;
}

// 13 — PM Assignment
message DesignAssignPMRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string assignment_type = 1;
    int32 to_id = 2;
    string to_name = 3;
  }

  Payload payload = 6;
  string created_at = 7;
}

message DesignAssignPMResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string assignment_type = 1;
    int32 to_id = 2;
    string to_name = 3;
  }

  Payload payload = 4;
}

// 14 — New Quote
message DesignQuoteRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string quote_id = 1;
    string quote_link = 2;
  }

  Payload payload = 6;
  string created_at = 7;
}

message DesignQuoteResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string quote_id = 1;
    string quote_link = 2;
  }

  Payload payload = 3;
}

// 15 — P2P Completed
message DesignP2PRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string designer_name = 6;
  string created_at = 7;
}

message DesignP2PResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string designer_name = 1;
  }

  Payload payload = 4;
}

// 16 — PM Approve / Reject (after DQC2)
message DesignPMStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string dqc_round = 8;
  string designer_name = 9;
  string approver_name = 10;
  string created_at = 11;
  string rejection_reason = 12;
}

message DesignPMStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string dqc_round = 3;
    string designer_name = 4;
    string approver_name = 5;
    string rejection_reason = 6;
  }

  Payload payload = 4;
}

// 17 — Notification Feed
message DesignNotificationFeedRequest {
  string since = 1;
  int32 limit = 2;
  string project_id = 3;
}

message DesignNotificationFeedResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    string notification_type = 3;
    string notification_action = 4;
    int32 designer_id = 5;
    string payload = 6;
    string created_at = 7;
  }

  repeated Data data = 1;
}

// 17 — Notification Counts
message DesignNotificationCountsRequest {
  string since = 1;
}

message DesignNotificationCountsResponse {
  message ByType {
    int32 LEAD = 1;
    int32 PHASE = 2;
    int32 MILESTONE = 3;
    int32 PAYMENT = 4;
    int32 DQC = 5;
    int32 MMT = 6;
    int32 MEETING = 7;
    int32 ASSIGNMENT = 8;
    int32 QUOTE = 9;
    int32 P2P = 10;
  }

  message Data {
    int32 total = 1;
    ByType by_type = 2;
  }

  Data data = 1;
}

// 18 — Notification Details
message DesignNotificationDetailsRequest {
  int32 notification_id = 1;
}

message DesignNotificationDetailsResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    string notification_type = 3;
    string notification_action = 4;
    int32 designer_id = 5;
    string payload = 6;
    string created_at = 7;
  }

  Data data = 1;
}


// -----------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------

service NotifyService {

  // Cancellation — PUT
  rpc Cancellation(CancellationRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      put: "/v1/meetings/cancellation"
      body: "*"
    };
  }

  rpc GetAllCancellations(GetByLeadIdentifierRequest) returns (CancellationListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation"
    };
  }

  rpc GetCancellationByID(GetByMeetingIDRequest) returns (CancellationResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/cancellation/{meeting_id}"
    };
  }

  // Success
  rpc CreateSuccess(CreateSuccessRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/success"
      body: "*"
    };
  }

  rpc GetAllSuccesses(GetByLeadIdentifierRequest) returns (SuccessListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success"
    };
  }

  rpc GetSuccessByLeadIdentifier(GetByLeadIdentifierRequest) returns (SuccessResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/success/{lead_identifier}"
    };
  }

  // Scheduled
  rpc CreateScheduled(CreateScheduledRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      post: "/v1/meetings/scheduled"
      body: "*"
    };
  }

  rpc GetAllScheduled(GetScheduledByLeadIdentifierRequest) returns (ScheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled"
    };
  }

  rpc GetScheduledByID(GetScheduledByIDRequest) returns (ScheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/scheduled/{meeting_id}"
    };
  }

  // Rescheduled — PUT
  rpc Rescheduled(RescheduledRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      put: "/v1/meetings/rescheduled"
      body: "*"
    };
  }

  rpc GetAllRescheduled(GetRescheduledByLeadIdentifierRequest) returns (RescheduledListResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled"
    };
  }

  rpc GetRescheduledByID(GetRescheduledByIDRequest) returns (RescheduledResponse) {
    option (google.api.http) = {
      get: "/v1/meetings/rescheduled/{meeting_id}"
    };
  }

  // Leads
  rpc CreateLead(CreateLeadRequest) returns (LeadResponse) {
    option (google.api.http) = {
      post: "/v1/leads"
      body: "*"
    };
  }

  rpc GetAllLeads(CountsRequest) returns (LeadListResponse) {
    option (google.api.http) = {
      get: "/v1/leads"
    };
  }

  rpc GetLeadByIdentifier(GetByLeadIdentifierRequest) returns (LeadResponse) {
    option (google.api.http) = {
      get: "/v1/leads/{lead_identifier}"
    };
  }

  // Booking
  rpc CreateBooking(CreateBookingRequest) returns (BookingResponse) {
    option (google.api.http) = {
      post: "/v1/bookings"
      body: "*"
    };
  }

  rpc GetAllBookings(GetBookingByLeadIdentifierRequest) returns (BookingListResponse) {
    option (google.api.http) = {
      get: "/v1/bookings"
    };
  }

  rpc GetBookingByID(GetBookingByIDRequest) returns (BookingResponse) {
    option (google.api.http) = {
      get: "/v1/bookings/{booking_id}"
    };
  }

  // Counts
  rpc GetCounts(CountsRequest) returns (CountsResponse) {
    option (google.api.http) = {
      get: "/v1/counts"
    };
  }

 // -----------------------------------------------------------------------
// Design Notification APIs (01-18)
// -----------------------------------------------------------------------

// 01 — Pre-10% New Lead
rpc CreateDesignLeadPre10(DesignLeadPre10Request) returns (DesignLeadPre10Response) {
  option (google.api.http) = {
    post: "/v1/design/notifications/lead/pre-10"
    body: "*"
  };
}

// 02 — 10–20% Phase Entered
rpc CreateDesignLead1020(DesignLead1020Request) returns (DesignLead1020Response) {
  option (google.api.http) = {
    post: "/v1/design/notifications/lead/10-20"
    body: "*"
  };
}

// 03 — Milestone Completed
rpc CreateDesignMilestone(DesignMilestoneRequest) returns (DesignMilestoneResponse) {
  option (google.api.http) = {
    post: "/v1/design/notifications/milestone"
    body: "*"
  };
}

// 04 — Payment Requested
rpc CreateDesignPaymentRequest(
    DesignPaymentRequestRequest
) returns (DesignPaymentRequestResponse) {
  option (google.api.http) = {
    post: "/v1/design/notifications/payment/request"
    body: "*"
  };
}

// 05 — Payment / Sales Closure Status
rpc CreateDesignPaymentStatus(
    DesignPaymentStatusRequest
) returns (DesignPaymentStatusResponse) {
  option (google.api.http) = {
    post: "/v1/design/notifications/payment/status"
    body: "*"
  };
}

// 06 — DQC Requested
rpc CreateDesignDQCRequest(
    DesignDQCRequestRequest
