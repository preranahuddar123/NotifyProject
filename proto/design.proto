syntax = "proto3";

package design;

import "google/api/annotations.proto";

option go_package = "./protogen/design";

// -----------------------------------------------------------------------
// Shared Message Types
// -----------------------------------------------------------------------

message Recipient {
  int32 user_id = 1;
  string role = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PRE_10_PERCENT = 1;
  MILESTONE_10_PERCENT = 2;
  MILESTONE_40_PERCENT = 3;
}

// -----------------------------------------------------------------------
// Design Notification Messages (APIs 01-18)
// -----------------------------------------------------------------------

// 01 — Pre-10% New Lead
message DesignLeadPre10Request {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string current_phase = 1;
    string designer_name = 2;
    string sales_executive_name = 3;

    message Slot {
      string date = 1;
      string slot_time = 2;
    }

    Slot slot = 4;
    string meeting_type = 5;
  }

  Payload payload = 4;
  string event_id = 5;
  repeated Recipient recipients = 6;
}

message DesignLeadPre10Response {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string current_phase = 1;
    string designer_name = 2;
    string sales_executive_name = 3;

    message Slot {
      string date = 1;
      string slot_time = 2;
    }

    Slot slot = 4;
    string meeting_type = 5;
  }

  Payload payload = 6;
  string created_at = 7;
}

// 02 — 10–20% Phase Entered
message DesignLead1020Request {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string previous_phase = 1;
    string trigger = 2;
    string message = 3;
  }

  Payload payload = 4;
  string event_id = 5;
  repeated Recipient recipients = 6;
}

message DesignLead1020Response {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string phase = 6;

    message Payload {
      string previous_phase = 1;
      string trigger = 2;
      string message = 3;
    }

    Payload payload = 7;
    string created_at = 8;
  }

  Data data = 1;
}

// 03 — Milestone Completed
message DesignMilestoneRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string milestone_name = 1;
    string task_name = 2;
    int32 milestone_index = 3;
    string designer_name = 4;
  }

  Payload payload = 4;
  string event_id = 5;
  repeated Recipient recipients = 6;
}

message DesignMilestoneResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string milestone_name = 6;
    string task_name = 7;
    int32 milestone_index = 8;
    string designer_name = 9;
    string created_at = 10;
  }

  Data data = 1;
}

// 04 — Payment Requested
message DesignPaymentRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    PaymentType payment_type = 1;
    string upload_name = 2;
    double amount = 3;
  }

  Payload payload = 4;
  string event_id = 5;
  repeated Recipient recipients = 6;
}

message DesignPaymentRequestResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    PaymentType payment_type = 6;
    string upload_name = 7;
    double amount = 8;
    string created_at = 9;
  }

  Data data = 1;
}

// 05 — Payment / Sales Closure Status
message DesignPaymentStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string payment_type = 8;
  string milestone_context = 9;
  string approver_name = 10;
  double amount = 11;
  string created_at = 12;
  string rejection_reason = 13;
  string event_id = 14;
  repeated Recipient recipients = 15;
}

message DesignPaymentStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string payment_type = 3;
    string milestone_context = 4;
    string approver_name = 5;
    double amount = 6;
    string rejection_reason = 7;
  }

  Payload payload = 4;
}

// 06 — DQC Requested
message DesignDQCRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string dqc_round = 4;
  int32 review_id = 5;
  string designer_name = 6;
  string event_id = 7;
  repeated Recipient recipients = 8;
}

message DesignDQCRequestResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;
    string dqc_round = 6;
    int32 review_id = 7;
    string designer_name = 8;
    string created_at = 9;
  }
  Data data = 1;
}

// 07 — DQC Status
message DesignDQCStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string dqc_round = 8;
  string designer_name = 9;
  string created_at = 10;
  string rejection_reason = 11;
  string event_id = 12;
  repeated Recipient recipients = 13;
}

message DesignDQCStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string dqc_round = 3;
    string designer_name = 4;
    string rejection_reason = 5;
  }

  Payload payload = 4;
}

// 08 — MMT Visit Requested
message DesignMMTRequestRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string mmt_scope = 6;
  string visit_date = 7;
  string visit_time = 8;
  int32 mmt_manager_id = 9;
  string designer_name = 10;
  string mmt_manager_name = 11;
  string created_at = 12;
  string event_id = 13;
  repeated Recipient recipients = 14;
}

message DesignMMTRequestResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string mmt_scope = 1;
    string visit_date = 2;
    string visit_time = 3;
    int32 mmt_manager_id = 4;
    string designer_name = 5;
    string mmt_manager_name = 6;
  }

  Payload payload = 4;
}

// 09 — MMT Executive Assigned
message DesignMMTAssignRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string assignment_type = 1;
    string to_name = 2;
    int32 to_id = 3;
  }

  Payload payload = 6;
  string created_at = 7;
  string event_id = 8;
  repeated Recipient recipients = 9;
}

message DesignMMTAssignResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string assignment_type = 1;
    string to_name = 2;
    int32 to_id = 3;
  }

  Payload payload = 4;
}

// 10 — MMT Documents Ready
message DesignMMTDocReadyRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string mmt_scope = 1;
    string via = 2;
    string upload_name = 3;
    string approved_by = 4;
  }

  Payload payload = 6;
  string created_at = 7;
  string event_id = 8;
  repeated Recipient recipients = 9;
}

message DesignMMTDocReadyResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string mmt_scope = 1;
    string via = 2;
    string upload_name = 3;
    string approved_by = 4;
  }

  Payload payload = 3;
}

// 11 — Design Meeting Scheduled
message DesignMeetingRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string meeting_type = 6;
  string mod = 7;

  message Slot {
    string date = 1;
    string time_slot = 2;
  }

  Slot slot = 8;
  string created_at = 9;
  string event_id = 10;
  repeated Recipient recipients = 11;
}

message DesignMeetingResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string meeting_type = 1;
    string mod = 2;

    message Slot {
      string date = 1;
      string time_slot = 2;
    }

    Slot slot = 3;
  }

  Payload payload = 3;
}

// 12 — Designer Reassignment
message DesignAssignDesignerRequest {
  string project_id = 1;
  string lead_name = 2;
  string notification_type = 3;
  string notification_action = 4;

  message Payload {
    string assignment_type = 1;
    int32 from_id = 2;
    int32 to_id = 3;
    string from_name = 4;
    string to_name = 5;
  }

  Payload payload = 5;
  string created_at = 6;
  string event_id = 7;
  repeated Recipient recipients = 8;
}

message DesignAssignDesignerResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string assignment_type = 1;
    int32 from_id = 2;
    int32 to_id = 3;
    string from_name = 4;
    string to_name = 5;
  }

  Payload payload = 3;
}

// 13 — PM Assignment
message DesignAssignPMRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string assignment_type = 1;
    int32 to_id = 2;
    string to_name = 3;
  }

  Payload payload = 6;
  string created_at = 7;
  string event_id = 8;
  repeated Recipient recipients = 9;
}

message DesignAssignPMResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    int32 designer_id = 3;
    string notification_type = 4;
    string notification_action = 5;

    message Payload {
      string assignment_type = 1;
      int32 to_id = 2;
      string to_name = 3;
    }

    Payload payload = 6;
    string created_at = 7;
  }

  Data data = 1;
}

// 14 — New Quote
message DesignQuoteRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;

  message Payload {
    string quote_id = 1;
    string quote_link = 2;
  }

  Payload payload = 6;
  string created_at = 7;
  string event_id = 8;
  repeated Recipient recipients = 9;
}

message DesignQuoteResponse {
  string project_id = 1;
  string lead_name = 2;

  message Payload {
    string quote_id = 1;
    string quote_link = 2;
  }

  Payload payload = 3;
}

// 15 — P2P Completed
message DesignP2PRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string designer_name = 6;
  string created_at = 7;
  string event_id = 8;
  repeated Recipient recipients = 9;
}

message DesignP2PResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string designer_name = 1;
  }

  Payload payload = 4;
}

// 16 — PM Approve / Reject (after DQC2)
message DesignPMStatusRequest {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;
  string notification_type = 4;
  string notification_action = 5;
  string status = 6;
  string decision_type = 7;
  string dqc_round = 8;
  string designer_name = 9;
  string approver_name = 10;
  string created_at = 11;
  string rejection_reason = 12;
  string event_id = 13;
  repeated Recipient recipients = 14;
}

message DesignPMStatusResponse {
  string project_id = 1;
  string lead_name = 2;
  int32 designer_id = 3;

  message Payload {
    string status = 1;
    string decision_type = 2;
    string dqc_round = 3;
    string designer_name = 4;
    string approver_name = 5;
    string rejection_reason = 6;
  }

  Payload payload = 4;
}

// 17 — Notification Feed
message DesignNotificationFeedRequest {
  string since = 1;
  int32 limit = 2;
  string project_id = 3;
}

message DesignNotificationFeedResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    string notification_type = 3;
    string notification_action = 4;
    int32 designer_id = 5;
    string payload = 6;
    string created_at = 7;
  }

  repeated Data data = 1;
}

// 17 — Notification Counts
message DesignNotificationCountsRequest {
  string since = 1;
}

message DesignNotificationCountsResponse {
  message ByType {
    int32 LEAD = 1;
    int32 PHASE = 2;
    int32 MILESTONE = 3;
    int32 PAYMENT = 4;
    int32 DQC = 5;
    int32 MMT = 6;
    int32 MEETING = 7;
    int32 ASSIGNMENT = 8;
    int32 QUOTE = 9;
    int32 P2P = 10;
  }

  message Data {
    int32 total = 1;
    ByType by_type = 2;
  }

  Data data = 1;
}

// 18 — Notification Details
message DesignNotificationDetailsRequest {
  int32 notification_id = 1;
}

message DesignNotificationDetailsResponse {
  message Data {
    string project_id = 1;
    string lead_name = 2;
    string notification_type = 3;
    string notification_action = 4;
    int32 designer_id = 5;
    string payload = 6;
    string created_at = 7;
  }

  Data data = 1;
}

// -----------------------------------------------------------------------
// 19+ — Inbox / Bell Notifications
// -----------------------------------------------------------------------

message DesignInboxRequest {
  int32 user_id = 1;
  string since = 2;
  string project_id = 3;
  int32 limit = 4;
}

message DesignInboxItem {
  int64 id = 1;
  string event_id = 2;
  int32 user_id = 3;
  string recipient_role = 4;
  string project_id = 5;
  string lead_name = 6;
  int32 designer_id = 7;
  string notification_type = 8;
  string notification_action = 9;
  string payload = 10;
  string created_at = 11;
  string read_at = 12;
}

message DesignInboxResponse {
  repeated DesignInboxItem data = 1;
}

message DesignInboxCountsRequest {
  int32 user_id = 1;
  string since = 2;
}

message DesignInboxCountsResponse {
  message ByType {
    int32 LEAD = 1;
    int32 PHASE = 2;
    int32 MILESTONE = 3;
    int32 PAYMENT = 4;
    int32 DQC = 5;
    int32 MMT = 6;
    int32 MEETING = 7;
    int32 ASSIGNMENT = 8;
    int32 QUOTE = 9;
    int32 P2P = 10;
  }

  message Data {
    int32 total = 1;
    ByType by_type = 2;
  }

  Data data = 1;
}

message MarkDesignNotificationReadRequest {
  int64 id = 1;
  int32 user_id = 2;
}

message MarkDesignNotificationReadResponse {
  bool success = 1;
}

message MarkAllDesignNotificationsReadRequest {
  int32 user_id = 1;
}

message MarkAllDesignNotificationsReadResponse {
  bool success = 1;
  int32 count = 2;
}

message CreateDesignInboxTicketRequest {
  int32 user_id = 1;
}

message CreateDesignInboxTicketResponse {
  string ticket = 1;
  int32 expires_in = 2;
}

// -----------------------------------------------------------------------
// DesignService
// -----------------------------------------------------------------------

service DesignService {

  // 01 — Pre-10% New Lead
  rpc CreateDesignLeadPre10(DesignLeadPre10Request) returns (DesignLeadPre10Response) {
    option (google.api.http) = {
      post: "/v1/design/notifications/lead/pre-10"
      body: "*"
    };
  }

  // 02 — 10–20% Phase Entered
  rpc CreateDesignLead1020(DesignLead1020Request) returns (DesignLead1020Response) {
    option (google.api.http) = {
      post: "/v1/design/notifications/lead/10-20"
      body: "*"
    };
  }

  // 03 — Milestone Completed
  rpc CreateDesignMilestone(DesignMilestoneRequest) returns (DesignMilestoneResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/milestone"
      body: "*"
    };
  }

  // 04 — Payment Requested
  rpc CreateDesignPaymentRequest(
      DesignPaymentRequestRequest
  ) returns (DesignPaymentRequestResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/payment/request"
      body: "*"
    };
  }

  // 05 — Payment / Sales Closure Status
  rpc CreateDesignPaymentStatus(
      DesignPaymentStatusRequest
  ) returns (DesignPaymentStatusResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/payment/status"
      body: "*"
    };
  }

  // 06 — DQC Requested
  rpc CreateDesignDQCRequest(
      DesignDQCRequestRequest
  ) returns (DesignDQCRequestResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/dqc/request"
      body: "*"
    };
  }

  // 07 — DQC Status
  rpc CreateDesignDQCStatus(
      DesignDQCStatusRequest
  ) returns (DesignDQCStatusResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/dqc/status"
      body: "*"
    };
  }

  // 08 — MMT Visit Requested
  rpc CreateDesignMMTRequest(
      DesignMMTRequestRequest
  ) returns (DesignMMTRequestResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/mmt/request"
      body: "*"
    };
  }

  // 09 — MMT Executive Assigned
  rpc CreateDesignMMTAssign(
      DesignMMTAssignRequest
  ) returns (DesignMMTAssignResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/mmt/assign"
      body: "*"
    };
  }

  // 10 — MMT Documents Ready
  rpc CreateDesignMMTDocReady(
      DesignMMTDocReadyRequest
  ) returns (DesignMMTDocReadyResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/mmt/doc-ready"
      body: "*"
    };
  }

  // 11 — Design Meeting Scheduled
  rpc CreateDesignMeeting(
      DesignMeetingRequest
  ) returns (DesignMeetingResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/meeting"
      body: "*"
    };
  }

  // 12 — Designer Reassignment
  rpc CreateDesignAssignDesigner(
      DesignAssignDesignerRequest
  ) returns (DesignAssignDesignerResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/assign/designer"
      body: "*"
    };
  }

  // 13 — PM Assignment
  rpc CreateDesignAssignPM(
      DesignAssignPMRequest
  ) returns (DesignAssignPMResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/assign/pm"
      body: "*"
    };
  }

  // 14 — New Quote
  rpc CreateDesignQuote(
      DesignQuoteRequest
  ) returns (DesignQuoteResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/quote"
      body: "*"
    };
  }

  // 15 — P2P Completed
  rpc CreateDesignP2P(
      DesignP2PRequest
  ) returns (DesignP2PResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/p2p"
      body: "*"
    };
  }

  // 16 — PM Approve / Reject (after DQC2)
  rpc CreateDesignPMStatus(
      DesignPMStatusRequest
  ) returns (DesignPMStatusResponse) {
    option (google.api.http) = {
      post: "/v1/design/notifications/pm/status"
      body: "*"
    };
  }

  // 17 — Legacy Notification Feed (stubs)
  rpc GetDesignNotificationFeed(
      DesignNotificationFeedRequest
  ) returns (DesignNotificationFeedResponse) {
    option (google.api.http) = {
      get: "/v1/design/notifications"
    };
  }

  // 18 — Legacy Details
  rpc GetDesignNotificationDetails(
      DesignNotificationDetailsRequest
  ) returns (DesignNotificationDetailsResponse) {
    option (google.api.http) = {
      get: "/v1/design/notifications/{notification_id}"
    };
  }

  // 18b — Legacy Counts
  rpc GetDesignNotificationCounts(
      DesignNotificationCountsRequest
  ) returns (DesignNotificationCountsResponse) {
    option (google.api.http) = {
      get: "/v1/design/notifications/counts"
    };
  }

  // =====================================================================
  // New User-Scoped Inbox & Bell API Services
  // =====================================================================

  // 19 — Get User Inbox Feed
  rpc GetDesignInbox(DesignInboxRequest) returns (DesignInboxResponse) {
    option (google.api.http) = {
      get: "/v1/design/inbox"
    };
  }

  // 20 — Get Unread Counts for Bell Icon
  rpc GetDesignInboxCounts(DesignInboxCountsRequest) returns (DesignInboxCountsResponse) {
    option (google.api.http) = {
      get: "/v1/design/inbox/counts"
    };
  }

  // 21 — Mark Single Notification as Read
  rpc MarkDesignNotificationRead(MarkDesignNotificationReadRequest) returns (MarkDesignNotificationReadResponse) {
    option (google.api.http) = {
      post: "/v1/design/inbox/{id}/read"
      body: "*"
    };
  }

  // 22 — Mark All Notifications as Read
  rpc MarkAllDesignNotificationsRead(MarkAllDesignNotificationsReadRequest) returns (MarkAllDesignNotificationsReadResponse) {
    option (google.api.http) = {
      post: "/v1/design/inbox/read-all"
      body: "*"
    };
  }

  // 23 — Issue WebSocket Handshake Ticket
  rpc CreateDesignInboxTicket(CreateDesignInboxTicketRequest) returns (CreateDesignInboxTicketResponse) {
    option (google.api.http) = {
      post: "/v1/design/inbox/ws-ticket"
      body: "*"
    };
  }
}
